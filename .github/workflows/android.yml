name: App Android (APK)

on:
  push:
    branches: [main]
    paths: ['src/**', 'android-app/**', 'tools/**', 'icon-*.png', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gerar páginas do app
        run: python3 tools/build.py
      - name: Preparar projeto Android
        working-directory: android-app
        run: |
          npm ci
          npx cap sync android
      - name: Compilar APK assinado
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace
      - name: Publicar APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android-app/android/app/build/outputs/apk/release/app-release.apk diario-de-ferro.apk
          cp android-app/android/app/build/outputs/bundle/release/app-release.aab diario-de-ferro.aab
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest diario-de-ferro.apk diario-de-ferro.aab \
            --title "App Android — versão ${GITHUB_RUN_NUMBER}" \
            --notes "Compilado de ${GITHUB_SHA::7} em $(date -u '+%d/%m/%Y %H:%M') UTC. Baixe o arquivo diario-de-ferro.apk e instale por cima da versão anterior."
